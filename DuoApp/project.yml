name: DuoApp
options:
  bundleIdPrefix: dev.outerlens
  deploymentTarget:
    iOS: "26.0"
packages:
  Purchases:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.43.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Outer Lens
    INFOPLIST_KEY_NSCameraUsageDescription: Outer Lens uses the camera to take photos and show framing to your subject.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DuoApp:
    type: application
    platform: iOS
    sources:
      - App
      - Duo
      - Shared
      - Features
      - Monetization
      - DesignSystem
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.outerlens.DuoApp
    dependencies:
      - package: Purchases
        product: RevenueCat
      - package: Purchases
        product: RevenueCatUI
schemes:
  DuoApp:
    build:
      targets:
        DuoApp: all
    run:
      config: Debug
